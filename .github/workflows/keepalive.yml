name: Datenbank wach halten
# Supabase pausiert kostenlose Projekte nach 7 Tagen ohne Zugriff (z. B. in den Sommerferien).
# Dieser Ablauf fragt alle 3 Tage kurz die Datenbank ab. Einmal im Monat schreibt er zusätzlich
# ein Datum in .github/keepalive.txt – sonst schaltet GitHub geplante Abläufe nach 60 Tagen
# ohne Änderung im Repository ab.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/trainingstage?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Antwort: $code"
          test "$code" = "200"
      - uses: actions/checkout@v4
      - name: Monatlicher Lebenszeichen-Eintrag
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat .github/keepalive.txt 2>/dev/null)" != "$month" ]; then
            echo "$month" > .github/keepalive.txt
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "Lebenszeichen $month"
            git push
          fi
